[package]
name = "laminar-py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python bindings for Laminar (PyO3)"

[lib]
name = "laminar"
crate-type = ["cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
laminar-core.workspace = true
laminar-io.workspace = true

[dependencies.pyo3]
version = "0.22"
optional = true
features = ["extension-module"]
