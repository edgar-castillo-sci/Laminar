[package]
name = "laminar-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core types and algorithms for JAM chains"

[features]
default = ["canon", "cells", "children"]
canon = []
children = ["canon"]  # children needs kappa_fast
cells = []

[dependencies]
smallvec = "1.13"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"

[[bench]]
name = "canon"
harness = false

[[bench]]
name = "children"
harness = false

[[bench]]
name = "augment"
harness = false
