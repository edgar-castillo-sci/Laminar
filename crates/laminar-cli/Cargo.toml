[package]
name = "laminar-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI: sandwich, compare, sample, modules. Default: honeycomb + JAM."

[[bin]]
name = "laminar"
path = "src/main.rs"

[dependencies]
laminar-core.workspace = true
laminar-io.workspace = true
laminar-markov.workspace = true
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
