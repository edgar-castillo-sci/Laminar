# Sample Laminar config.
#
# Copy to:
#   - ~/.config/laminar/laminar.conf      (global, XDG)
#   - ./.laminar.conf                     (local, project-specific)
#
# Hierarchy: CLI > env (LAMINAR_*) > local > global > built-in defaults.

[modules]
symmetry = "honeycomb"
notation = "jam"

[defaults]
option = "OneH"
output = "."
export_format = "stdout"
layers = 4
# reference_cell = "examples/MoS2_1H.toml"

[behavior]
verbosity = "normal"
