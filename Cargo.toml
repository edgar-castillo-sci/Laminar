[workspace]
resolver = "2"
members = [
    "crates/laminar-core",
    "crates/laminar-io",
    "crates/laminar-markov",
    "crates/laminar-cli",
    "crates/skeleton",
    "crates/laminar-py",
]

[workspace.package]
version = "0.1.0-alpha.5"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Edgar Castillo <edgar.castillo.sci@gmail.com>"]
repository = "https://github.com/edgar-castillo-sci/Laminar"

[workspace.dependencies]
laminar-core = { path = "crates/laminar-core" }
laminar-io = { path = "crates/laminar-io" }
laminar-markov = { path = "crates/laminar-markov" }
